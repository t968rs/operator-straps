[project]
name = "operator-straps"
version = "0.1.0"
description = "Agent harness plugins: PR review and commit tooling, guard hooks, session mods"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -p no:cacheprovider"
pythonpath = ["plugins/harness/lib", "tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Explicit rule set: ruff's default selection changes between releases, and the newer defaults
# (UP006/UP045) contradict the Optional/Union house style.
select = ["E4", "E7", "E9", "F", "E501"]

[tool.pylint.format]
max-line-length = 110
