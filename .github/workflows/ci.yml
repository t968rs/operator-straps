name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels that branch's superseded run; a push to main never cancels, so every
# main commit keeps its full run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pull requests run only the work their diff reaches (tools/select_tests.py); pushes to main run everything.
# Every job still reports success when its steps are skipped, so required checks keep working.

jobs:
  python:
    name: pytest + ruff (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: select work from the diff
        id: select
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python tools/select_tests.py --base "origin/$BASE_REF"
          else
            python tools/select_tests.py --full
          fi
      - if: ${{ steps.select.outputs.pytest != 'none' || steps.select.outputs.ruff != 'none' }}
        run: python -m pip install -r requirements-dev.txt
      - name: ruff
        if: ${{ steps.select.outputs.ruff != 'none' && runner.os == 'Linux' }}
        shell: bash
        env:
          RUFF_MODE: ${{ steps.select.outputs.ruff }}
        # Line length (E501) is a local nudge, not a CI gate.
        run: |
          if [ "$RUFF_MODE" = "full" ]; then
            python -m ruff check --extend-ignore E501 plugins tests tools
          else
            xargs python -m ruff check --extend-ignore E501 < .artifacts/ruff-files.txt
          fi
      - name: pytest
        if: ${{ steps.select.outputs.pytest != 'none' }}
        shell: bash
        # Linux runs every selected test. Windows runs only the cross_os subset (launcher, worktree and junction
        # behavior); the rest is OS-independent logic that costs ~9x more there on process spawns. Exit 5 on
        # Windows means no selected file carries the marker, which is a pass.
        run: |
          mapfile -t targets < .artifacts/selected-tests.txt
          args=()
          if [ "$RUNNER_OS" = "Windows" ]; then args=(-m cross_os); fi
          rc=0
          python -m pytest "${targets[@]}" "${args[@]}" -q --junitxml=.artifacts/pytest-junit.xml || rc=$?
          if [ "$RUNNER_OS" = "Windows" ] && [ "$rc" = 5 ]; then rc=0; fi
          exit $rc
      - name: test runtime catalog
        if: ${{ !cancelled() && hashFiles('.artifacts/pytest-junit.xml') != '' }}
        shell: bash
        run: python tools/ci_test_runtime_catalog.py .artifacts/pytest-junit.xml .artifacts/test-runtime-catalog.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('.artifacts/test-runtime-catalog.json') != '' }}
        with:
          name: test-runtime-catalog-${{ matrix.os }}
          path: .artifacts/test-runtime-catalog.json
      - name: hpy launches under sh
        if: ${{ steps.select.outputs.pytest != 'none' }}
        shell: bash
        run: sh plugins/harness/scripts/hpy -c "import jsonschema, referencing, pydantic, sys; print(sys.version)"

  plugins:
    name: plugin validate + mod tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: select work from the diff
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python tools/select_tests.py --base "origin/$BASE_REF"
          else
            python tools/select_tests.py --full
          fi
      - if: ${{ steps.select.outputs.plugins == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: ${{ steps.select.outputs.plugins == 'true' }}
        run: npm install -g @anthropic-ai/claude-code
      - name: validate (strict)
        if: ${{ steps.select.outputs.plugins == 'true' }}
        run: |
          claude plugin validate --strict .
          for p in plugins/*/; do claude plugin validate --strict "$p"; done
      - name: mod tests
        if: ${{ steps.select.outputs.plugins == 'true' }}
        run: |
          for p in plugins/pr-review-watch plugins/git-status plugins/band-line plugins/session-bookmark plugins/pytest-scope plugins/todo-watch; do claude plugin test "$p"; done
